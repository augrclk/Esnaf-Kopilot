server {
    listen 80;
    server_name _;   # IP ile erişim için _ kullan, domain varsa buraya yaz

    # Büyük response timeout — görsel üretim uzun sürer
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    # Frontend static dosyalar
    root /opt/esnaf-kopilot/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming için buffer kapatılmalı
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection '';
        chunked_transfer_encoding on;
    }

    # Üretilen görseller
    location /outputs/ {
        alias /opt/esnaf-kopilot/backend/outputs/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Dosya boyutu limiti (görsel yüklemeler için)
    client_max_body_size 20M;
}
