[project]
name = "ecommerce-image-scraper"
version = "0.1.0"
description = "Trendyol product image scraping module"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["ecommerce_image_scraper*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
